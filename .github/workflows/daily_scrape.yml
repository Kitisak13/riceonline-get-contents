name: Rice Online News Daily Aggregator

on:
  schedule:
    # Runs daily at 00:00 UTC (07:00 AM Bangkok Time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  scrape-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore persistent cache
        uses: actions/cache@v4
        with:
          path: data/
          key: rice-news-cache-${{ github.run_id }}
          restore-keys: |
            rice-news-cache-

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Run Rice News Automation Pipeline
        env:
          TZ: "Asia/Bangkok"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash"
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python pipeline.py

      - name: Upload Report to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rice-news-daily-report
          path: output/*.docx
          retention-days: 14
